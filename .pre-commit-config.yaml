exclude: |
  (?x)
  # NOT INSTALLABLE ADDONS
  # END NOT INSTALLABLE ADDONS
  # Files and folders generated by bots, to avoid loops
  ^setup/|/static/description/index\.html$|
  # We don't want to mess with tool-generated files
  .svg$|/tests/([^/]+/)?cassettes/|^.copier-answers.yml$|^.github/|^eslint.config.cjs|^prettier.config.cjs|
  ^README\.md$|/static/(src/)?lib/|^docs/_templates/.*\.html$|readme/.*\.(rst|md)$|/build/|/dist/|/tests/samples/.*|(LICENSE.*|COPYING.*)
default_language_version:
  python: python3
  node: "22.9.0"
repos:
  - repo: local
    hooks:
      - id: forbidden-files
        name: forbidden files
        entry: found forbidden files; remove them
        language: fail
        files: "\\.rej$"
      - id: en-po-files
        name: en.po files cannot exist
        entry: found a en.po file
        language: fail
        files: '[a-zA-Z0-9_]*/i18n/en\.po$'
  - repo: https://github.com/sbidoul/whool
    rev: v1.3
    hooks:
      - id: whool-init
  - repo: https://github.com/oca/maintainer-tools
    rev: f9b919b9868143135a9c9cb03021089cabba8223
    hooks:
      - id: oca-update-pre-commit-excluded-addons
      - id: oca-fix-manifest-website
        args: ["https://github.com/focuz-ai/odoo-spec-kit"]
      - id: oca-gen-addon-readme
        args:
          - --addons-dir=.
          - --branch=16.0
          - --org-name=focuz-ai
          - --repo-name=odoo-spec-kit
          - --if-source-changed
          - --keep-source-digest
          - --convert-fragments-to-markdown
      - id: oca-gen-external-dependencies
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.1.6
    hooks:
      - id: oca-checks-odoo-module
      - id: oca-checks-po
        args: [--disable=po-pretty-format]
  - repo: local
    hooks:
      - id: prettier
        name: prettier (with plugin-xml)
        entry: prettier
        args: [--write, --list-different, --ignore-unknown]
        types: [text]
        files: \.(css|htm|html|js|json|jsx|less|md|scss|toml|ts|xml|yaml|yml)$
        language: node
        additional_dependencies: ["prettier@3.6.2", "@prettier/plugin-xml@3.4.2"]
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: eslint
        args: [--color, --fix]
        verbose: true
        types: [javascript]
        language: node
        additional_dependencies:
          ["eslint@9.35.0", "eslint-plugin-jsdoc@57.0.8", "globals@16.0.0"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: /README\.rst$|\.pot?$
      - id: end-of-file-fixer
        exclude: /README\.rst$|\.pot?$
      - id: debug-statements
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
        exclude: /README\.rst$|^docs/.*\.rst$
      - id: check-symlinks
      - id: check-xml
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/OCA/pylint-odoo
    rev: v9.3.15
    hooks:
      - id: pylint_odoo
        name: pylint with optional checks
        args: [--rcfile=.pylintrc, --exit-zero]
        verbose: true
      - id: pylint_odoo
        args: [--rcfile=.pylintrc-mandatory]
